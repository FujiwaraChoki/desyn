[package]
name = "desyn-describe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desyn describe / lint: semantic description of a design page for the AI and the design-check UI (DOCUMENT_MODEL section 7)."
publish = false

[dependencies]
desyn-core = { path = "../desyn-core" }
desyn-text = { path = "../desyn-text" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
desyn-text = { path = "../desyn-text", features = ["bundled"] }
criterion = { version = "=0.8.2", default-features = false }

[[bench]]
name = "describe"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
