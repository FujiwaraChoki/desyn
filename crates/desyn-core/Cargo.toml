[package]
name = "desyn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desyn engine core: document model, transactions, geometry, paths, layout, hit testing, snapping, plans."
publish = false

[features]
default = []
# Convenience helpers that read/write designs from the filesystem (not available on wasm32-unknown-unknown).
std-fs = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
indexmap = { version = "=2.14.2", features = ["serde"] }
rustc-hash = "=2.1.3"
kurbo = "=0.13.1"
i_overlay = "=9.1.0"

[dev-dependencies]
proptest = "=1.12.0"
criterion = { version = "=0.8.2", default-features = false }

[[bench]]
name = "core"
harness = false
