name: Desktop

# Builds the GPUI desktop app (apps/desktop, crate desyn-desktop) for Linux, macOS (universal) and Windows.
# Artifacts are attached to every run; on v* tags they are also published to the GitHub release.
# Code signing / notarization need certificates that live outside this repository and are not done here.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "deploy/env/public.env"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "deploy/env/public.env"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.98.1"
  MANIFEST: apps/desktop/Cargo.toml
  PACKAGE: desyn-desktop

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, targets: x86_64-unknown-linux-gnu }
          - { label: macos-universal, os: macos-15, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { label: windows-x86_64, os: windows-2025, targets: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7

      # Hosted endpoints for the client build (Convex Cloud prod + the web app), from the committed
      # deploy/env/public.env, so CI builds never point at a stale or self-hosted backend.
      - name: Hosted endpoints
        run: |
          pub=deploy/env/public.env
          {
            echo "DESYN_CONVEX_URL=$(sed -n 's/^NEXT_PUBLIC_CONVEX_URL=//p' "${pub}")"
            echo "DESYN_CONVEX_SITE_URL=$(sed -n 's/^NEXT_PUBLIC_CONVEX_SITE_URL=//p' "${pub}")"
            echo "DESYN_APP_URL=$(sed -n 's/^APP_URL=//p' "${pub}")"
          } >> "$GITHUB_ENV"

      - name: Detect desktop crate
        id: detect
        run: |
          if [ -f "${MANIFEST}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.targets }}

      - if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        name: Linux system libraries (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libzstd-dev

      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: desktop-${{ matrix.label }}

      - if: steps.detect.outputs.present == 'true'
        name: Build
        run: |
          set -euo pipefail
          IFS=',' read -r -a targets <<< "${{ matrix.targets }}"
          for t in "${targets[@]}"; do
            cargo build --release --locked --manifest-path "${MANIFEST}" -p "${PACKAGE}" --target "${t}"
          done

      - if: steps.detect.outputs.present == 'true'
        name: Package
        id: package
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --format-version 1 --no-deps --manifest-path "${MANIFEST}" | jq -r .target_directory)"
          bin="$(cargo metadata --format-version 1 --no-deps --manifest-path "${MANIFEST}" |
            jq -r --arg p "${PACKAGE}" '.packages[] | select(.name == $p) | .targets[] | select(.kind[] == "bin") | .name' | head -n 1)"
          version="$(cargo metadata --format-version 1 --no-deps --manifest-path "${MANIFEST}" |
            jq -r --arg p "${PACKAGE}" '.packages[] | select(.name == $p) | .version')"
          out="${RUNNER_TEMP}/dist"
          mkdir -p "${out}"
          name="desyn-${version}-${{ matrix.label }}"
          case "${{ runner.os }}" in
            Linux)
              mkdir -p "${out}/${name}"
              cp "${target_dir}/x86_64-unknown-linux-gnu/release/${bin}" "${out}/${name}/desyn"
              cp LICENSE "${out}/${name}/"
              tar -C "${out}" -czf "${out}/${name}.tar.gz" "${name}"
              echo "file=${out}/${name}.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              app="${out}/Desyn.app"
              mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
              lipo -create \
                "${target_dir}/aarch64-apple-darwin/release/${bin}" \
                "${target_dir}/x86_64-apple-darwin/release/${bin}" \
                -output "${app}/Contents/MacOS/Desyn"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0"><dict>' \
                '<key>CFBundleName</key><string>Desyn</string>' \
                '<key>CFBundleDisplayName</key><string>Desyn</string>' \
                '<key>CFBundleIdentifier</key><string>app.desyn.desktop</string>' \
                "<key>CFBundleShortVersionString</key><string>${version}</string>" \
                "<key>CFBundleVersion</key><string>${version}</string>" \
                '<key>CFBundleExecutable</key><string>Desyn</string>' \
                '<key>CFBundlePackageType</key><string>APPL</string>' \
                '<key>LSMinimumSystemVersion</key><string>13.0</string>' \
                '<key>NSHighResolutionCapable</key><true/>' \
                '<key>CFBundleURLTypes</key><array><dict><key>CFBundleURLSchemes</key><array><string>desyn</string></array></dict></array>' \
                '</dict></plist>' > "${app}/Contents/Info.plist"
              # Ad-hoc signature so Gatekeeper reports "unidentified developer" instead of "damaged".
              codesign --force --deep --sign - "${app}"
              ditto -c -k --keepParent "${app}" "${out}/${name}.zip"
              echo "file=${out}/${name}.zip" >> "$GITHUB_OUTPUT"
              ;;
            Windows)
              mkdir -p "${out}/${name}"
              cp "${target_dir}/x86_64-pc-windows-msvc/release/${bin}.exe" "${out}/${name}/Desyn.exe"
              cp LICENSE "${out}/${name}/LICENSE.txt"
              (cd "${out}" && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
              echo "file=${out}/${name}.zip" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ steps.package.outputs.file }}
          retention-days: 30

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        # A tag without the desktop crate produces no artifacts; the next step handles that.
        continue-on-error: true
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Any artifacts?
        id: any
        run: |
          if compgen -G "dist/*" >/dev/null; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.any.outputs.ok == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
