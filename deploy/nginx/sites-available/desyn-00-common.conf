# Desyn: http-level definitions shared by every desyn-* server block.
# Installed as /etc/nginx/sites-available/desyn-00-common.conf and enabled first (the "00" sorts it before the
# server blocks). Every name defined here is prefixed with desyn_ so nothing collides with other sites on this
# shared host. This file must be included in the http {} context (Debian/Ubuntu sites-enabled/* is).
#
# The database/backend is Convex Cloud: browsers and the apps talk to *.convex.cloud / *.convex.site directly,
# so no Convex host is served here (only app.desyn.app/api/v1/* and /mcp are passed through to the site URL).
# Hosts: desyn.app (+www), app.desyn.app, docs.desyn.app (human-facing, pre-launch basic auth) and
# render.desyn.app (render worker for Convex Cloud, shared-secret header, no basic auth).

# --- Pre-launch gate -----------------------------------------------------------------------------------
# desyn/local/auth-switch.conf defines $desyn_prelaunch (1 = basic auth on, 0 = launched). It is the single
# switch: deploy/scripts/basic-auth.sh {on|off} rewrites it, runs `nginx -t` and reloads.
include desyn/local/auth-switch.conf;
# desyn/local/gate.conf (root-only, generated) defines $desyn_gate_token and $desyn_gate_cookie_ok. After a
# visitor passes basic auth on one site host, nginx sets the desyn_gate cookie for .desyn.app, so moving
# between desyn.app, app. and docs. does not prompt again.
include desyn/local/gate.conf;

# Requests from this host and from the desyn docker network (server-side calls of the Next apps to their own
# public URLs, healthcheck.sh --public) skip the pre-launch prompt.
geo $desyn_trusted_src {
    default 0;
    include desyn/local/trusted.geo;
}

map "$desyn_prelaunch:$desyn_gate_cookie_ok:$desyn_trusted_src" $desyn_site_realm {
    default off;
    "1:0:0" "Desyn (pre-launch)";
}

# Only sent on successful (2xx/3xx) responses, i.e. after basic auth passed.
map $desyn_prelaunch $desyn_gate_set_cookie {
    default "";
    1 "desyn_gate=$desyn_gate_token; Domain=.desyn.app; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax";
}

# --- render.desyn.app pre-filter -----------------------------------------------------------------------
# Convex Cloud actions call the worker with `x-desyn-secret: RENDER_WORKER_SECRET` (DOCUMENT_MODEL section 8).
# nginx only checks that a plausible secret is present (32-512 visible ASCII characters) so anonymous scans never
# reach the worker; the worker compares the value in constant time. The header is never logged.
map $http_x_desyn_secret $desyn_render_secret_present {
    default 0;
    "~^[!-~]{32,512}$" 1;
}

# --- Proxying ------------------------------------------------------------------------------------------
map $http_upgrade $desyn_connection_upgrade {
    default upgrade;
    "" "";
}

# Blue/green pairs: the idle colour is down (connection refused), nginx skips it and retries the other one.
upstream desyn_landing {
    server 127.0.0.1:47100 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:47120 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

upstream desyn_web {
    server 127.0.0.1:47101 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:47121 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

upstream desyn_docs {
    server 127.0.0.1:47102 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:47122 max_fails=1 fail_timeout=5s;
    keepalive 8;
}

upstream desyn_worker {
    server 127.0.0.1:47103 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:47123 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

# Hashed Next.js build assets (/_next/static) and optimized images. Keeping old chunks for 30 days lets
# browsers holding an old HTML page finish loading after a deploy replaced the container.
proxy_cache_path /var/cache/nginx/desyn levels=1:2 keys_zone=desyn_static:50m max_size=2g inactive=30d use_temp_path=off;

# --- Rate limiting -------------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=desyn_req_site:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=desyn_req_app:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=desyn_req_auth:10m rate=10r/m;
# Agent API + MCP on app.desyn.app (proxied to the Convex Cloud site URL; Convex applies per-key limits too).
limit_req_zone $binary_remote_addr zone=desyn_req_api:10m rate=20r/s;
# Convex Cloud egress uses few addresses, so the render zone is generous per address; requests without the
# secret header never count against it (they are rejected before limit_req runs in the location).
limit_req_zone $binary_remote_addr zone=desyn_req_render:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=desyn_req_render_probe:5m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=desyn_conn:20m;

# --- Logging -------------------------------------------------------------------------------------------
log_format desyn_main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                      'up=$upstream_addr cache=$upstream_cache_status host=$host';
