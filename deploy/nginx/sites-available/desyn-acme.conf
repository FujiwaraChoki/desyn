# Desyn: plain-HTTP server for every desyn host. Serves ACME http-01 challenges (certbot --webroot with
# -w /var/www/desyn-acme, also compatible with certbot --nginx) and redirects everything else to HTTPS.
# Installed by bootstrap.sh before certificates exist; it references no certificate files.

server {
    include desyn/local/listen-80.conf;
    server_name desyn.app www.desyn.app app.desyn.app docs.desyn.app render.desyn.app;

    access_log /var/log/nginx/desyn-http.access.log desyn_main;
    error_log /var/log/nginx/desyn-http.error.log warn;

    include desyn/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
