# Desyn: render.desyn.app, the render worker (crates/desyn-worker) for Convex Cloud. Installed by certs.sh.
# Upstream: worker blue/green.
#
# Convex Cloud actions call RENDER_WORKER_URL=https://render.desyn.app with the shared secret in the
# x-desyn-secret header (DOCUMENT_MODEL section 8). This host therefore never asks for basic auth (independent of
# the launch switch) and exposes only the worker API: POST /v1/{render,thumbnail,describe,layout,measure,apply}
# and GET /healthz. Requests without a plausible secret header stop here with 401; the worker itself compares the
# value in constant time. Convex Cloud has no fixed egress addresses, so there is no IP allowlist.

server {
    include desyn/local/listen-443.conf;
    server_name render.desyn.app;

    include desyn/snippets/tls.conf;
    include desyn/snippets/csp-render.conf;
    # Never hand out the pre-launch gate cookie from a host without basic auth.
    set $desyn_cookie "";
    include desyn/snippets/headers.conf;
    include desyn/snippets/limits.conf;
    include desyn/snippets/timeouts.conf;
    auth_basic off;

    access_log /var/log/nginx/desyn-render.access.log desyn_main;
    error_log /var/log/nginx/desyn-render.error.log warn;

    # A design is at most ~5 MB of JSON (Convex gzips bodies above 1 MB) plus the page being rendered.
    client_max_body_size 64m;
    client_body_buffer_size 1m;
    limit_conn desyn_conn 64;
    default_type application/json;

    location = /healthz {
        limit_except GET {
            deny all;
        }
        limit_req zone=desyn_req_render_probe burst=10 nodelay;
        proxy_pass http://desyn_worker;
        include desyn/snippets/proxy.conf;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location ~ ^/v1/(render|thumbnail|describe|layout|measure|apply)$ {
        if ($request_method != POST) {
            add_header Allow "POST" always;
            return 405 '{"error":"method_not_allowed"}';
        }
        if ($desyn_render_secret_present = 0) {
            return 401 '{"error":"unauthorized"}';
        }
        limit_req zone=desyn_req_render burst=200 nodelay;
        proxy_pass http://desyn_worker;
        include desyn/snippets/proxy.conf;
        # Blue/green: a refused connection (idle colour) is retried on the other colour. Requests that reached a
        # worker are never replayed (POST is not idempotent for nginx), so a render runs at most once here;
        # Convex retries 5xx/429/network errors itself.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        # Exports (PDF, PPTX, MP4) can take minutes and return large bodies: stream them back.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404 '{"error":"not_found"}';
    }
}
