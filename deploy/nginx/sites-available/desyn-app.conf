# Desyn: app.desyn.app (web app / editor). Installed by deploy/scripts/certs.sh. Upstream: web blue/green.
#
# Better Auth (/api/auth/*) is proxied by the Next app itself to the Convex Cloud site URL (server-side fetch),
# so auth cookies stay first-party on app.desyn.app. nginx forwards the visitor address as X-Real-IP /
# X-Forwarded-For (snippets/proxy.conf); the Next handler passes those headers on to Convex.
# The Agent API (/api/v1/*) and the MCP endpoint (/mcp) go from nginx straight to the Convex site URL
# (snippets/convex-site.conf): no basic auth (API keys use the Authorization header), no Next hop for streams.

server {
    include desyn/local/listen-443.conf;
    server_name app.desyn.app;

    include desyn/snippets/tls.conf;
    include desyn/snippets/csp-app.conf;
    set $desyn_cookie $desyn_gate_set_cookie;
    include desyn/snippets/headers.conf;
    include desyn/snippets/auth-site.conf;
    include desyn/snippets/compression.conf;
    include desyn/local/brotli.conf;
    include desyn/snippets/limits.conf;
    include desyn/snippets/timeouts.conf;

    access_log /var/log/nginx/desyn-app.access.log desyn_main;
    error_log /var/log/nginx/desyn-app.error.log warn;

    # File bytes go straight to S3 with presigned URLs; this covers imports (SVG/PDF/PPTX) posted to the app.
    client_max_body_size 25m;
    limit_req zone=desyn_req_app burst=120 nodelay;
    limit_conn desyn_conn 96;

    set $desyn_upstream desyn_web;
    include desyn/snippets/next-static.conf;

    # Better Auth credential endpoints (proxied by the Next app to Convex): brute-force protection at the edge,
    # in addition to Better Auth's own per-IP limits.
    location ~ ^/api/auth/(sign-in|sign-up|forget-password|reset-password|magic-link|send-verification-email|request-password-reset) {
        limit_req zone=desyn_req_auth burst=10 nodelay;
        proxy_pass http://desyn_web;
        include desyn/snippets/proxy.conf;
    }

    # iOS universal links: Apple's CDN fetches this without credentials, so it must never ask for basic auth.
    location = /.well-known/apple-app-site-association {
        auth_basic off;
        proxy_pass http://desyn_web;
        include desyn/snippets/proxy.conf;
    }

    location ^~ /api/v1/ {
        include desyn/snippets/convex-site.conf;
    }

    location = /mcp {
        include desyn/snippets/convex-site.conf;
    }

    location ^~ /mcp/ {
        include desyn/snippets/convex-site.conf;
    }

    location / {
        proxy_pass http://desyn_web;
        include desyn/snippets/proxy.conf;
        include desyn/snippets/next-upstream.conf;
        # Streaming responses (RSC, AI run events) must reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
