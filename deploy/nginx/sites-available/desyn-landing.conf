# Desyn: desyn.app (landing, blog, templates gallery, legal) and the www -> apex redirect.
# Installed by deploy/scripts/certs.sh once the certificate exists. Upstream: landing blue/green.

server {
    include desyn/local/listen-443.conf;
    server_name desyn.app;

    include desyn/snippets/tls.conf;
    include desyn/snippets/csp-landing.conf;
    set $desyn_cookie $desyn_gate_set_cookie;
    include desyn/snippets/headers.conf;
    include desyn/snippets/auth-site.conf;
    include desyn/snippets/compression.conf;
    include desyn/local/brotli.conf;
    include desyn/snippets/limits.conf;
    include desyn/snippets/timeouts.conf;

    access_log /var/log/nginx/desyn-landing.access.log desyn_main;
    error_log /var/log/nginx/desyn-landing.error.log warn;

    client_max_body_size 2m;
    limit_req zone=desyn_req_site burst=80 nodelay;
    limit_conn desyn_conn 64;

    set $desyn_upstream desyn_landing;
    include desyn/snippets/next-static.conf;

    location / {
        proxy_pass http://desyn_landing;
        include desyn/snippets/proxy.conf;
        include desyn/snippets/next-upstream.conf;
    }
}

server {
    include desyn/local/listen-443.conf;
    server_name www.desyn.app;

    include desyn/snippets/tls.conf;
    include desyn/snippets/hsts.conf;
    access_log /var/log/nginx/desyn-landing.access.log desyn_main;

    location / {
        return 301 https://desyn.app$request_uri;
    }
}
