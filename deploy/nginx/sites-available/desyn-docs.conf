# Desyn: docs.desyn.app. Installed by deploy/scripts/certs.sh. Upstream: docs blue/green.
# When no docs container answers (first deploy, outage), visitors are sent to desyn.app/docs instead of a 502.

server {
    include desyn/local/listen-443.conf;
    server_name docs.desyn.app;

    include desyn/snippets/tls.conf;
    include desyn/snippets/csp-docs.conf;
    set $desyn_cookie $desyn_gate_set_cookie;
    include desyn/snippets/headers.conf;
    include desyn/snippets/auth-site.conf;
    include desyn/snippets/compression.conf;
    include desyn/local/brotli.conf;
    include desyn/snippets/limits.conf;
    include desyn/snippets/timeouts.conf;

    access_log /var/log/nginx/desyn-docs.access.log desyn_main;
    error_log /var/log/nginx/desyn-docs.error.log warn;

    client_max_body_size 2m;
    limit_req zone=desyn_req_site burst=80 nodelay;
    limit_conn desyn_conn 64;

    set $desyn_upstream desyn_docs;
    include desyn/snippets/next-static.conf;

    location / {
        proxy_pass http://desyn_docs;
        include desyn/snippets/proxy.conf;
        include desyn/snippets/next-upstream.conf;
        error_page 502 504 = @docs_fallback;
    }

    location @docs_fallback {
        return 302 https://desyn.app/docs$request_uri;
    }
}
