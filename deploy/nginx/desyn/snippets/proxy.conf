# Common reverse-proxy settings for desyn upstreams (HTTP/1.1 keepalive + websocket upgrade).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge: replace any client-supplied X-Forwarded-For instead of appending to it, so Better Auth's
# and the apps' per-IP rate limits (which read the first address) cannot be dodged with a forged header. With
# a CDN in front, configure real_ip on the host and $remote_addr is still the visitor.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $desyn_connection_upgrade;
proxy_hide_header X-Powered-By;
