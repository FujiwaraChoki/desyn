# Certificate issued by deploy/scripts/certs.sh (certbot --cert-name desyn, all desyn hostnames as SANs).
ssl_certificate /etc/letsencrypt/live/desyn/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/desyn/privkey.pem;
# Mozilla "intermediate" profile. Let's Encrypt ended OCSP, so no stapling.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:desyn_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
