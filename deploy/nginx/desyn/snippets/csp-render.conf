# CSP for render.desyn.app. Responses are JSON or rendered files (PNG, SVG, PDF, ...) consumed by Convex, never by
# a browser page; 'none' neutralizes scripts in a rendered SVG opened directly.
set $desyn_csp "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
set $desyn_frame_options "DENY";
