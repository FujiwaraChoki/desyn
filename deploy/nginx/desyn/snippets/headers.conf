# Security headers for every desyn TLS server block. Per-host values come from variables the server block
# sets before including this file:
#   $desyn_csp            Content-Security-Policy (see desyn/snippets/csp-*.conf)
#   $desyn_frame_options  X-Frame-Options value
#   $desyn_cookie         "$desyn_gate_set_cookie" on the site hosts, "" on render.desyn.app (the gate token
#                         must never be handed out by a host that has no basic auth)
add_header Content-Security-Policy $desyn_csp always;
add_header X-Frame-Options $desyn_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Set-Cookie $desyn_cookie;
include desyn/snippets/hsts.conf;
