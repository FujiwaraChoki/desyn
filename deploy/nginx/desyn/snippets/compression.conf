# gzip for text responses (brotli, when the module is loaded, comes from desyn/local/brotli.conf).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml application/rss+xml application/atom+xml application/manifest+json
           application/wasm image/svg+xml font/ttf font/otf;
