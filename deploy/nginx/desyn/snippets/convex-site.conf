# Location body for app.desyn.app /api/v1/* (Agent API) and /mcp (MCP over HTTP): proxied straight to the Convex
# Cloud site URL (SPEC section 10), where these HTTP actions live. Keep the host in sync with
# deploy/env/public.env NEXT_PUBLIC_CONVEX_SITE_URL (deploy/tests/contracts.test.sh checks it).
#
# No basic auth, independent of the launch switch: API clients authenticate with `Authorization: Bearer <key>`,
# which is the header basic auth would need, and the same endpoints are public on the convex.site host anyway.
# For the same reason this location never hands out the pre-launch gate cookie.
set $desyn_convex_site_host "opulent-alpaca-530.eu-west-1.convex.site";
set $desyn_cookie "";
auth_basic off;
limit_req zone=desyn_req_api burst=60 nodelay;

# A variable target is resolved per request through desyn/local/resolver.conf, so Convex Cloud address
# changes are picked up without an nginx reload.
include desyn/local/resolver.conf;
proxy_pass https://$desyn_convex_site_host;
proxy_http_version 1.1;
proxy_set_header Host $desyn_convex_site_host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
# Replaced, not appended (see snippets/proxy.conf).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_ssl_server_name on;
proxy_ssl_name $desyn_convex_site_host;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_session_reuse on;
proxy_connect_timeout 10s;
# MCP streamable HTTP and agent run events stream: pass bytes through as they arrive.
proxy_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 120s;
proxy_hide_header X-Powered-By;
