# HSTS is only included from TLS server blocks, which certs.sh installs after certificates exist.
# Pre-launch: one day, so a misconfiguration is recoverable. At launch raise to max-age=31536000 (RUNBOOK
# "Enabling launch"); add "preload" only once every subdomain has been HTTPS-only for weeks.
add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
