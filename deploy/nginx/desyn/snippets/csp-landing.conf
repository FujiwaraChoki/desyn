# CSP for desyn.app (marketing site, live-editor demo running the wasm engine, PostHog EU + DataFast). The Convex
# Cloud origins (deploy/env/public.env) allow public template/gallery reads from the browser.
# Next.js App Router emits inline bootstrap scripts, hence 'unsafe-inline' for scripts (no nonce middleware).
set $desyn_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://eu-assets.i.posthog.com https://datafa.st; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://datafa.st https://opulent-alpaca-530.eu-west-1.convex.cloud wss://opulent-alpaca-530.eu-west-1.convex.cloud https://opulent-alpaca-530.eu-west-1.convex.site; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests";
set $desyn_frame_options "DENY";
