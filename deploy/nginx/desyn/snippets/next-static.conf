# Next.js build assets and image optimizer, cached at the edge. Include inside a server block after
# `set $desyn_upstream <upstream name>;` and the app's headers snippet.
location ^~ /_next/static/ {
    proxy_pass http://$desyn_upstream;
    include desyn/snippets/proxy.conf;
    # During a blue/green switch a chunk may exist only in the new colour: ask the other one on 404.
    proxy_next_upstream error timeout http_404 http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_buffering on;
    proxy_cache desyn_static;
    proxy_cache_key "$host$uri";
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    access_log off;
    include desyn/snippets/headers-cache.conf;
}

location ^~ /_next/image {
    proxy_pass http://$desyn_upstream;
    include desyn/snippets/proxy.conf;
    include desyn/snippets/next-upstream.conf;
    proxy_buffering on;
    proxy_cache desyn_static;
    proxy_cache_key "$host$request_uri$http_accept";
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    include desyn/snippets/headers-cache.conf;
}
