# CSP for app.desyn.app (editor). connect-src allows any https origin because BYOK users call their own
# provider endpoints (OpenRouter, OpenAI-compatible servers, Fal) straight from the browser and upload to
# presigned S3 URLs; the Convex Cloud sync websocket needs its wss:// origin explicitly (deploy/env/public.env
# NEXT_PUBLIC_CONVEX_URL; deploy/tests check that both stay in sync). http://localhost / 127.0.0.1 cover
# browser-run local models (Ollama, LM Studio). No upgrade-insecure-requests: it would rewrite those localhost
# calls to https. frame-ancestors 'self' keeps present mode embeddable inside the app itself.
set $desyn_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://eu-assets.i.posthog.com https://datafa.st https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss://opulent-alpaca-530.eu-west-1.convex.cloud http://localhost:* http://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; object-src 'none'; manifest-src 'self'";
set $desyn_frame_options "SAMEORIGIN";
